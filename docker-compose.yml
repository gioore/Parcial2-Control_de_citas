services:
  mysql:
    image: mysql:8.0
    container_name: his-citas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-his_citas}
      MYSQL_USER: ${DB_USERNAME:-his_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-his_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - his_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: his-citas-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-HIS Control de Citas}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-his_citas}
      DB_USERNAME: ${DB_USERNAME:-his_app}
      DB_PASSWORD: ${DB_PASSWORD:-his_app_password}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "${APP_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  his_mysql_data:
    name: his-citas-mysql-data
